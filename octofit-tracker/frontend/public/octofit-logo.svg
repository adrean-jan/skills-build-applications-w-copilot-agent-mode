<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Octopus Body -->
  <circle cx="24" cy="16" r="10" fill="#61dafb" stroke="#0d6efd" stroke-width="2"/>
  
  <!-- Octopus Eyes -->
  <circle cx="20" cy="14" r="2.5" fill="#0d6efd"/>
  <circle cx="28" cy="14" r="2.5" fill="#0d6efd"/>
  
  <!-- Octopus Smile -->
  <path d="M 20 17 Q 24 19 28 17" stroke="#0d6efd" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Octopus Tentacles -->
  <path d="M 18 25 Q 16 30 17 38" stroke="#61dafb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 22 25 Q 20 32 21 40" stroke="#61dafb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 26 25 Q 24 32 25 40" stroke="#61dafb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 30 25 Q 32 30 31 38" stroke="#61dafb" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Tentacle Suction Cups -->
  <circle cx="17" cy="37" r="1.5" fill="#0d6efd"/>
  <circle cx="21" cy="39" r="1.5" fill="#0d6efd"/>
  <circle cx="25" cy="39" r="1.5" fill="#0d6efd"/>
  <circle cx="31" cy="37" r="1.5" fill="#0d6efd"/>
  
  <!-- Fitness Element - Dumbbell -->
  <rect x="34" y="12" width="10" height="2.5" fill="#198754" rx="1"/>
  <circle cx="35.5" cy="13.25" r="2" fill="#198754"/>
  <circle cx="44.5" cy="13.25" r="2" fill="#198754"/>
  
  <!-- Star for Achievement -->
  <polygon points="8,6 9.5,10 14,10 11,13 12.5,17 8,14 3.5,17 5,13 2,10 6.5,10" fill="#ffc107"/>
